# GitHub Metrics for p3xz — lowlighter/metrics
# Generates the SVG files referenced in README.md (Metrics section):
#   metrics-overview.svg, metrics-isocalendar.svg, metrics-languages.svg,
#   metrics-achievements.svg, metrics-leetcode.svg
# Setup: https://github.com/lowlighter/metrics
#
# REQUIRED SECRET — the workflow cannot run without it:
#   Repository secret named METRICS_TOKEN holding a GitHub personal access
#   token (classic, no scopes required for public repos; add `repo` only
#   if private-repo metrics are wanted).
#   Create it at: GitHub Settings > Developer settings > Personal access
#   tokens > Tokens (classic) > Generate new token, then
#   p3xz/p3xz > Settings > Secrets and variables > Actions > New repository secret.
#   Do NOT put any token in this file or in the README.
# Once the secret exists, run this workflow from the Actions tab
# (workflow_dispatch) or wait for the daily schedule.

name: Metrics

on:
  # Schedule daily updates (00:00 UTC)
  schedule: [{cron: "0 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run once when this workflow file itself changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Overview — classic template, base content + coding habits
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: p3xz
          template: classic
          filename: metrics-overview.svg
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # 2. Isometric commit calendar (half year)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: p3xz
          template: classic
          filename: metrics-isocalendar.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 3. Languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: p3xz
          template: classic
          filename: metrics-languages.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      # 4. Achievements
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: p3xz
          template: classic
          filename: metrics-achievements.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

      # 5. LeetCode (username namishyadav, as linked in the README)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: p3xz
          template: classic
          filename: metrics-leetcode.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: namishyadav
          plugin_leetcode_sections: solved, skills, recent
